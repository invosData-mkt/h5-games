<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>刷載具快手｜店員問「載具？」你要滑多久・發票存摺 invos</title>
<meta name="description" content="店員一問「載具？」，滑手機找到發票存摺亮出條碼，5 位客人測出你的結帳速度。">
<meta property="og:title" content="刷載具快手｜店員問「載具？」你要滑多久">
<meta property="og:description" content="滑手機找載具要幾秒？5 位客人測出你的結帳速度。小心店員問的不是載具。">
<meta property="og:type" content="website">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=JetBrains+Mono:wght@700;800&display=swap">
<style>
:root {
  color-scheme: light;
  --ink: #121722;
  --muted: #5A6476;
  --line: #CBD6EC;
  --blue: #2956E8;
  --blue-dark: #193BB5;
  --blue-soft: #DCE6FF;
  --green: #0A9F6E;
  --green-soft: #DDF5EC;
  --red: #D93A3F;
  --red-soft: #FCE4E4;
  --yellow: #FFD43B;
  --bubble: #FFF7CC;
  --wall: #EAF1FF;
  --f: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  --fn: 'JetBrains Mono', ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: #D9E4FF;
  color: var(--ink);
  font-family: var(--f);
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  overscroll-behavior: none;
}
button { font-family: inherit; cursor: pointer; }
.app {
  position: relative;
  max-width: 440px; height: 100dvh; min-height: 560px;
  margin: 0 auto;
  background: var(--wall);
  display: flex; flex-direction: column;
  overflow: hidden;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (min-width: 441px) { .app { box-shadow: 0 0 60px rgba(25, 59, 181, .18); } }

/* 頂列 */
.top { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 4px; z-index: 3; }
.brand { font-weight: 900; font-size: 15px; color: var(--blue-dark); letter-spacing: .02em; }
.snd { border: 0; background: #fff; color: var(--muted); font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; box-shadow: 0 1px 0 var(--line); }

/* 場景 */
.scene { position: relative; flex: 1; min-height: 0; }
.hand { height: 50%; flex: none; }
.shelf { position: absolute; left: 0; right: 0; top: 0; bottom: 26%; overflow: hidden; }
.shelf i { position: absolute; left: -4%; right: -4%; height: 10px; background: #C9D8F8; border-radius: 4px; }
.shelf i:nth-child(4) { top: 22%; } .shelf i:nth-child(5) { top: 50%; } .shelf i:nth-child(6) { top: 78%; }
.shelf b { position: absolute; bottom: 0; width: 7%; border-radius: 5px 5px 0 0; opacity: .5; }
.goods { position: absolute; left: 0; right: 0; height: 28%; }
.goods.g1 { top: -6%; } .goods.g2 { top: 22%; } .goods.g3 { top: 50%; }

.clerk { position: absolute; left: 50%; bottom: 22%; width: 36%; max-width: 150px; transform: translateX(-50%); }
.clerk.nod { animation: nod .35s; }
@keyframes nod { 40% { transform: translateX(-50%) translateY(6px) rotate(-2deg); } }

.bubble {
  position: absolute; left: 50%; top: 4%; transform: translateX(-50%);
  min-width: 150px; max-width: 86%; text-align: center; white-space: nowrap;
  background: #fff; border: 3px solid var(--ink); border-radius: 22px;
  padding: 10px 20px; font-weight: 900; font-size: 20px; color: var(--muted);
  box-shadow: 0 5px 0 rgba(18, 23, 34, .12);
  z-index: 2;
}
.bubble::after { content: ''; position: absolute; left: 50%; bottom: -13px; width: 20px; height: 20px; background: inherit; border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
.bubble.ask { background: var(--bubble); color: var(--ink); font-size: 34px; padding: 8px 26px; animation: pop .18s cubic-bezier(.2, 1.6, .5, 1); }
.bubble.go { background: var(--yellow); }
.bubble.ok { background: var(--green-soft); color: var(--green); font-size: 22px; }
.bubble.bad { background: var(--red-soft); color: var(--red); font-size: 20px; animation: shake .3s; }
@keyframes pop { from { transform: translateX(-50%) scale(.6); } }
@keyframes shake { 25% { margin-left: -8px; } 75% { margin-left: 8px; } }
.dots span { display: inline-block; animation: dot 1s infinite; } .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 30% { transform: translateY(-5px); } 60% { transform: none; } }

.counter { position: absolute; left: 0; right: 0; bottom: 0; height: 26%; background: #fff; border-top: 5px solid var(--ink); }
.counter::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 14px; background: var(--blue); }
.scanner { position: absolute; left: 50%; top: -30px; transform: translateX(-50%); width: 74px; height: 46px; background: var(--ink); border-radius: 10px 10px 4px 4px; }
.scanner::after { content: ''; position: absolute; left: 10px; right: 10px; top: 12px; height: 6px; border-radius: 3px; background: #FF5A5F; box-shadow: 0 0 10px #FF5A5F; opacity: .55; }
.scanner.beep::after { opacity: 1; background: #3CE6A0; box-shadow: 0 0 18px #3CE6A0; }

.queue { position: absolute; left: 14px; right: 14px; bottom: 8px; display: flex; align-items: flex-end; gap: 6px; }
.queue .lab { font-size: 12px; font-weight: 700; color: var(--muted); margin-right: 2px; padding-bottom: 6px; white-space: nowrap; }
.p { width: 30px; height: 44px; position: relative; transition: opacity .3s, transform .3s; }
.p::before { content: ''; position: absolute; left: 7px; top: 0; width: 16px; height: 16px; border-radius: 50%; background: #F2C9A5; border: 2px solid var(--ink); }
.p::after { content: ''; position: absolute; left: 2px; right: 2px; bottom: 0; height: 26px; border-radius: 12px 12px 4px 4px; background: var(--c, var(--blue)); border: 2px solid var(--ink); }
.p.done { opacity: .22; transform: scale(.82); }
.p.now { transform: translateY(-5px); }

/* 手機（滑動找 App） */
.hand { padding: 10px 16px 14px; background: #fff; z-index: 3; }
.phone {
  width: 100%; height: 100%; border: 4px solid var(--ink); border-radius: 26px;
  background: linear-gradient(160deg, #3B5BDB, #7048E8 60%, #E64980); color: #fff; position: relative; overflow: hidden;
  box-shadow: 0 6px 0 rgba(18, 23, 34, .18);
  touch-action: none; cursor: grab;
}
.phone .idle { position: absolute; inset: 0; z-index: 3; background: #121722; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; padding: 0 16px; }
.phone .idle b { font-size: 20px; font-weight: 900; }
.phone .idle span { font-size: 13px; color: #A9B4CC; font-weight: 500; }
.pages { position: absolute; left: 0; top: 0; bottom: 18px; width: 300%; display: flex; transition: transform .2s cubic-bezier(.2, .8, .3, 1); }
.pages.drag { transition: none; }
.page { width: 33.3333%; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); padding: 12px 8px 4px; }
.app-i { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .35); white-space: nowrap; }
.app-i i { width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; font-style: normal; font-size: 26px; background: var(--c, #fff); box-shadow: 0 2px 6px rgba(0, 0, 0, .25); pointer-events: none; }
.app-i.me i { background: #fff; border: 3px solid var(--blue); color: var(--blue); font-weight: 900; font-size: 24px; font-family: var(--f); }
.app-i.wrong i { animation: shake .3s; outline: 3px solid var(--red); }
.app-i.fld > i { background: rgba(255, 255, 255, .32); display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 3px; padding: 6px; place-items: stretch; }
.app-i.fld > i u { border-radius: 3px; background: var(--m, #fff); position: relative; }
.app-i.fld > i u.me { background: #fff; box-shadow: inset 0 0 0 2px var(--blue); }
.app-i.fld > i u.sub { background: rgba(255, 255, 255, .55); }
.app-i.fld > i u.sub.t::after { content: ''; position: absolute; inset: 25%; border-radius: 50%; background: var(--blue); }
.wdg { grid-column: 1 / -1; grid-row: span 2; margin: 2px 6px 8px; border-radius: 22px; background: #fff; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; box-shadow: 0 3px 10px rgba(0, 0, 0, .25); }
.wdg * { pointer-events: none; }
.wdg .wt { font-size: 12px; font-weight: 900; color: var(--blue); }
.wdg .wb { display: flex; height: 46px; } .wdg .wb i { background: var(--ink); margin-right: 2px; }
.wdg .wc { font-family: var(--fn); font-size: 11px; letter-spacing: .16em; color: var(--muted); }
.fview { position: absolute; inset: 0; z-index: 2; background: rgba(18, 23, 34, .8); display: flex; flex-direction: column; padding: 10px 14px 12px; }
.fhead { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 17px; margin-bottom: 6px; }
.fback { background: rgba(255, 255, 255, .18); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 900; }
.fgrid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); background: rgba(255, 255, 255, .14); border-radius: 22px; padding: 6px; }
.pdots { position: absolute; left: 0; right: 0; bottom: 6px; display: flex; justify-content: center; gap: 6px; z-index: 1; }
.pdots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, .4); }
.pdots i.on { background: #fff; }
.swipe-tip { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); z-index: 2; font-size: 22px; font-weight: 900; opacity: .85; animation: nudge 1s infinite; pointer-events: none; }
@keyframes nudge { 50% { transform: translate(-6px, -50%); } }
.phone .show { position: absolute; inset: 0; z-index: 4; background: #fff; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.bars { display: flex; align-items: stretch; height: 64px; }
.bars i { display: block; background: var(--ink); margin-right: 2px; }
.code { font-family: var(--fn); font-size: 13px; letter-spacing: .18em; color: var(--muted); }
.ms { font-family: var(--fn); font-size: 34px; font-weight: 800; color: var(--green); line-height: 1; margin-top: 2px; }
.ms small { font-family: var(--f); font-size: 15px; font-weight: 900; margin-left: 3px; }
.ms.slow { color: var(--red); }
.beam { position: absolute; left: 0; right: 0; top: 50%; height: 6px; margin-top: -3px; background: #FF3B3B; box-shadow: 0 0 14px 4px rgba(255, 59, 59, .55); z-index: 2; pointer-events: none; }
.beam { animation: pulse .7s infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.show.aim .ms { font-family: var(--f); font-size: 19px; font-weight: 900; color: var(--red); }
.show.aim.hit .beam { background: #19C37D; box-shadow: 0 0 14px 4px rgba(25, 195, 125, .6); }
.show.aim.hit .ms { color: var(--green); }

/* 開場、結果 */
.sheet { position: absolute; inset: 0; z-index: 10; background: var(--blue); color: #fff; display: flex; flex-direction: column; padding: calc(28px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
.sheet .tag { font-size: 14px; font-weight: 700; color: #DCE5FF; }
.hero-b { align-self: flex-start; margin-top: 18px; background: var(--bubble); color: var(--ink); border: 4px solid var(--ink); border-radius: 26px; padding: 6px 24px 8px; font-size: 44px; font-weight: 900; position: relative; transform: rotate(-3deg); box-shadow: 0 6px 0 rgba(0, 0, 0, .18); }
.hero-b::after { content: ''; position: absolute; left: 34px; bottom: -15px; width: 22px; height: 22px; background: inherit; border-right: 4px solid var(--ink); border-bottom: 4px solid var(--ink); transform: rotate(45deg); }
.sheet h1 { font-size: 50px; line-height: 1.08; font-weight: 900; margin: 28px 0 0; letter-spacing: .01em; }
.sheet h1 em { font-style: normal; color: var(--yellow); }
.sheet .lead { font-size: 17px; line-height: 1.7; font-weight: 500; color: #EEF2FF; margin: 16px 0 0; }
.diffs { margin: 18px 0 0; display: grid; gap: 8px; }
.diff { display: flex; align-items: center; gap: 12px; text-align: left; border: 2px solid rgba(255, 255, 255, .28); background: rgba(255, 255, 255, .08); color: #fff; border-radius: 16px; padding: 10px 14px; font-size: 13px; font-weight: 500; line-height: 1.45; }
.diff b { flex: none; font-size: 17px; font-weight: 900; width: 2.6em; }
.diff.on { background: #fff; color: var(--ink); border-color: #fff; }
.diff.on b { color: var(--blue); }
.how { margin: 22px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.how li { display: flex; gap: 12px; align-items: center; background: rgba(255, 255, 255, .12); border-radius: 16px; padding: 12px 14px; font-size: 15px; font-weight: 700; line-height: 1.45; }
.how li b { flex: none; width: 30px; height: 30px; border-radius: 50%; background: #fff; color: var(--blue); display: grid; place-items: center; font-family: var(--fn); font-size: 15px; }
.grow { flex: 1; min-height: 18px; }
.cta { display: block; width: 100%; border: 0; border-radius: 999px; padding: 17px 20px; font-size: 19px; font-weight: 900; text-align: center; text-decoration: none; background: var(--yellow); color: var(--ink); box-shadow: 0 6px 0 rgba(0, 0, 0, .22); }
.cta:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0, 0, 0, .22); }
.cta.ghost { background: transparent; color: #fff; box-shadow: none; border: 2px solid rgba(255, 255, 255, .55); font-size: 16px; padding: 12px 20px; margin-top: 12px; }
.s-hint { text-align: center; font-size: 13px; color: #DCE5FF; min-height: 18px; margin: 10px 0 0; }

#s-result { background: var(--wall); color: var(--ink); padding-top: calc(20px + env(safe-area-inset-top, 0px)); }
.r-card { background: var(--blue); color: #fff; border-radius: 28px; padding: 24px 24px 26px; position: relative; overflow: hidden; flex: none; }
.r-card::after { content: ''; position: absolute; right: -90px; bottom: -110px; width: 260px; height: 260px; border-radius: 50%; background: rgba(255, 255, 255, .08); }
.r-num { font-family: var(--fn); font-size: 84px; font-weight: 800; line-height: 1; margin-top: 12px; letter-spacing: -.02em; }
.r-num small { font-family: var(--f); font-size: 26px; font-weight: 900; margin-left: 6px; letter-spacing: 0; }
.r-title { display: inline-block; margin-top: 14px; background: var(--ink); color: var(--yellow); font-size: 24px; font-weight: 900; padding: 8px 20px; border-radius: 999px; position: relative; z-index: 1; }
.r-line { margin: 12px 0 0; font-size: 15px; font-weight: 500; color: #EEF2FF; line-height: 1.6; position: relative; z-index: 1; }
.r-rounds { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 14px; flex: none; }
.r-rounds div { background: #fff; border-radius: 12px; padding: 8px 2px; text-align: center; font-family: var(--fn); font-size: 14px; font-weight: 800; }
.r-rounds div small { display: block; font-family: var(--f); font-size: 11px; font-weight: 700; color: var(--muted); }
.r-rounds div.best { background: var(--green-soft); color: var(--green); }
.r-rounds div.pen { color: var(--red); }
.watch { margin-top: 12px; background: #fff; border-radius: 18px; padding: 14px 16px; font-size: 14px; line-height: 1.65; font-weight: 500; color: var(--muted); flex: none; }
.watch b { color: var(--ink); font-weight: 900; font-size: 15px; display: block; margin-bottom: 2px; }
.btns { display: grid; gap: 12px; margin-top: 14px; flex: none; }
#s-result .cta { background: var(--blue); color: #fff; box-shadow: 0 6px 0 var(--blue-dark); }
#s-result .cta.white { background: #fff; color: var(--ink); box-shadow: 0 6px 0 var(--line); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row2 .cta { font-size: 16px; padding: 14px 10px; }
.hint { text-align: center; font-size: 13px; color: var(--muted); min-height: 20px; margin: 12px 0 0; font-weight: 500; flex: none; }
#shareImg { width: 100%; border-radius: 18px; margin-top: 10px; flex: none; -webkit-user-select: auto; user-select: auto; -webkit-touch-callout: default; }
@media (max-height: 700px) {
  .sheet h1 { font-size: 38px; margin-top: 22px; } .sheet h1 br { display: none; } .hero-b { font-size: 30px; margin-top: 10px; } .diffs { margin-top: 10px; gap: 6px; } .diff { padding: 7px 12px; } .how { margin-top: 14px; gap: 7px; } .how li { padding: 9px 12px; }
  .app-i i { width: 42px; height: 42px; font-size: 21px; } .app-i { font-size: 10px; gap: 2px; } .bars { height: 48px; } .wdg .wb { height: 34px; } .r-num { font-size: 68px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <span class="brand">發票存摺｜刷載具快手</span>
    <button class="snd" id="b-snd" type="button">🔊 音效開</button>
  </div>

  <div class="scene" id="scene">
    <div class="shelf" aria-hidden="true">
      <div class="goods g1" id="g1"></div><div class="goods g2" id="g2"></div><div class="goods g3" id="g3"></div>
      <i></i><i></i><i></i>
    </div>
    <div class="bubble" id="bubble" aria-live="polite"></div>
    <svg class="clerk" id="clerk" viewBox="0 0 200 230" aria-hidden="true">
      <path d="M22 230c0-62 34-92 78-92s78 30 78 92z" fill="#2956E8" stroke="#121722" stroke-width="5"/>
      <path d="M70 142h60l-8 88H78z" fill="#fff" stroke="#121722" stroke-width="5"/>
      <rect x="86" y="118" width="28" height="30" rx="8" fill="#F2C9A5" stroke="#121722" stroke-width="5"/>
      <circle cx="100" cy="82" r="50" fill="#FFD9B8" stroke="#121722" stroke-width="5"/>
      <path d="M46 62c8-30 28-44 54-44s46 14 54 44l-8 4c-24-12-68-12-92 0z" fill="#2956E8" stroke="#121722" stroke-width="5" stroke-linejoin="round"/>
      <rect x="84" y="30" width="32" height="14" rx="5" fill="#FFD43B" stroke="#121722" stroke-width="4"/>
      <circle cx="80" cy="88" r="5.5" fill="#121722"/><circle cx="120" cy="88" r="5.5" fill="#121722"/>
      <circle cx="68" cy="102" r="7" fill="#FF9E9E" opacity=".55"/><circle cx="132" cy="102" r="7" fill="#FF9E9E" opacity=".55"/>
      <path d="M88 108q12 9 24 0" fill="none" stroke="#121722" stroke-width="5" stroke-linecap="round"/>
      <rect x="82" y="168" width="36" height="20" rx="5" fill="#FFD43B" stroke="#121722" stroke-width="4"/>
    </svg>
    <div class="counter">
      <div class="scanner" id="scanner"></div>
      <div class="queue" id="queue"></div>
    </div>
  </div>

  <div class="hand">
    <div class="phone" id="phone" role="group" aria-label="手機主畫面，左右滑動找到發票存摺">
      <div class="idle" id="ph-idle"><b>聽到「載具？」再拿出手機</b><span>左右滑，找到「發票存摺」點開。太早滑、點錯 App 都加 0.3 秒</span></div>
      <div class="pages" id="pages"></div>
      <div class="pdots" id="pdots"><i></i><i></i><i></i></div>
      <div class="swipe-tip" id="swipe-tip" hidden>‹</div>
      <div class="fview" id="fview" hidden><div class="fhead"><span class="fback" data-back="1">‹ 返回</span><span id="ftitle"></span></div><div class="fgrid" id="fgrid"></div></div>
      <div class="show" id="ph-show" hidden>
        <span class="bars" id="bars"></span>
        <span class="code">/INV0S88</span>
        <span class="ms" id="ph-ms"></span>
        <span class="beam" id="beam" hidden></span>
      </div>
    </div>
  </div>

  <!-- 開場 -->
  <section class="sheet" id="s-start">
    <span class="tag">發票存摺 × 結帳反應挑戰</span>
    <div class="hero-b">載具？</div>
    <h1>刷載具<br><em>快手</em></h1>
    <p class="lead">店員一問「載具？」，你要多久才亮得出來？<br>他問袋子、會員的時候，手機先不要動。</p>
    <div class="diffs" id="diffs">
      <button class="diff" type="button" data-d="easy"><b>簡單</b><span>桌面有放載具小工具，點一下就好</span></button>
      <button class="diff on" type="button" data-d="mid"><b>中等</b><span>滑手機找到「發票存摺」，打開才能刷</span></button>

/* 體感：條碼打開後，把手機往前伸（加速度超過門檻）才算刷到 */

let aimStart = 0, grav = null, motSeen = false;

function onMotion(e) {
  let a = e.acceleration, mag = 0;

let page = 0, motion = false, locked = false, raised = false, downSince = 0, draws = [], oriSeen = false, curBeta = 70, aimT = 70, aimSince = 0;
let maxPage = 2, folders = [], stack = [];
function setPage(n) { page = Math.max(0, Math.min(maxPage, n)); $('pages').style.transform = `translateX(${-page * 33.3333}%)`; [...$('pdots').children].forEach((d, i) => d.classList.toggle('on', i === page)); if (page > 0) $('swipe-tip').hidden = true; }
const ME = '<span class="app-i me" data-app="me"><i>發</i>發票存摺</span>';

  if (await enableMotion()) { $('s-hint').textContent = ''; startGame(true); }
  else { $('s-hint').textContent = '這支手機沒有開放動作感測，改用一般模式。'; setTimeout(() => startGame(false), 1200); }
};
$('b-again').onclick = () => { track('replay'); startGame(); };

/* ---------- 分享 ---------- */
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
async function drawCard() {
  try { await document.fonts.ready; } catch (e) {}
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1350;
  const g = c.getContext('2d'), F = '"Noto Sans TC","PingFang TC",sans-serif', N = '"JetBrains Mono",monospace';
  g.fillStyle = '#2956E8'; g.fillRect(0, 0, 1080, 1350);
  g.fillStyle = '#fff'; g.globalAlpha = .08; g.beginPath(); g.arc(900, 1180, 520, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1;
  g.fillStyle = '#DCE5FF'; g.font = `700 40px ${F}`; g.fillText('發票存摺 × 刷載具快手', 90, 150);
  g.fillStyle = '#FFF7CC'; roundRect(g, 90, 210, 360, 130, 40); g.fill(); g.lineWidth = 6; g.strokeStyle = '#121722'; g.stroke();
  g.fillStyle = '#121722'; g.font = `900 72px ${F}`; g.fillText('載具？', 130, 300);
  g.fillStyle = '#fff'; g.font = `700 44px ${F}`; g.fillText(`找載具（${last.diff}），我只要`, 90, 480);
  g.font = `800 230px ${N}`; g.fillText(fmt(last.avg), 80, 720);
  const w = g.measureText(fmt(last.avg)).width; g.font = `900 70px ${F}`; g.fillText('秒', 80 + w + 30, 720);
  g.font = `900 60px ${F}`; const tw = g.measureText(last.title).width;
  g.fillStyle = '#121722'; roundRect(g, 90, 790, tw + 90, 110, 55); g.fill();
  g.fillStyle = '#FFD43B'; g.fillText(last.title, 135, 867);
  g.fillStyle = '#DCE5FF'; g.font = `700 42px ${F}`; g.fillText(`最快一次 ${fmt(last.best)} 秒`, 90, 990);
  g.fillStyle = '#fff'; g.font = `900 72px ${F}`; g.fillText('你能更快嗎？', 90, 1130);
  g.fillStyle = '#DCE5FF'; g.font = `500 32px ${F}`; g.fillText('invosdata-mkt.github.io/h5-games/carrier-speed.html', 90, 1260);
  return c;
}
$('b-share').onclick = async () => {
  track('share');
  const url = location.origin + location.pathname;
  const text = `店員問「載具？」我找出來只要 ${fmt(last.avg)} 秒（${last.diff}・${last.title}）。你能更快嗎？`;
  const c = await drawCard();
  try {
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    const file = new File([blob], 'carrier-speed.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text: text + ' ' + url }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  $('shareImg').src = c.toDataURL('image/png'); $('shareImg').hidden = false;
  try { await navigator.clipboard.writeText(text + ' ' + url); $('r-hint').textContent = '挑戰文字已複製；長按下方圖片可以儲存。'; }
  catch (e) { $('r-hint').textContent = '長按下方圖片儲存，傳給朋友挑戰。'; }
  $('shareImg').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
