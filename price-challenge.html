    if (ROLES[r] && n >= 0 && n <= 6 && t >= 5 && t <= 3600) return { r: r, n: n, t: t };

function renderQuestion() {
  const q = QUESTIONS[state.i];
  const dots = QUESTIONS.map((_, i) => `<i class="${i < state.i ? 'done' : i === state.i ? 'now' : ''}"></i>`).join('');
  app.innerHTML = `
    ${topbar(`<span class="pills"><span class="pill">${state.i + 1} /${QUESTIONS.length}</span><span class="pill" id="clock" aria-label="總時間">${mmss(elapsed())}</span></span>`)}
    <div class="dots" aria-hidden="true">${dots}</div>
    <div class="qhead">
      <div class="qmeta">
        <span class="qlevel">第 ${state.i + 1} 題・${q.level}</span>
        <span class="qtrap">${q.trap}</span>
      </div>
      <h2 class="qname" tabindex="-1">${q.name}</h2>
      <p class="qstory">${q.story}</p>
      <p class="qask">${q.ask}</p>
    </div>
    <div class="opts">${optHTML('a', q.a, q)}${optHTML('b', q.b, q)}</div>
    <div id="after"></div>`;
  app.querySelectorAll('.opt').forEach(btn => btn.addEventListener('click', () => answer(btn.dataset.k)));
  window.scrollTo(0, 0);
  document.querySelector('.qname').focus({ preventScroll: true });
}

function answer(k) {
  if (state.picks.length > state.i) return;
  const q = QUESTIONS[state.i];
  state.picks.push(k);
  const right = k === q.ans;
  track('answer', { q: state.i + 1, pick: k, correct: right });
  app.querySelectorAll('.opt').forEach(btn => {
    btn.disabled = true;
    btn.classList.add('revealed', btn.dataset.k === q.ans ? 'win' : 'lose');
    if (btn.dataset.k === k) btn.classList.add('picked');
  });
  const last = state.i === QUESTIONS.length - 1;
  document.getElementById('after').innerHTML = `
    <div tabindex="-1" class="verdict ${right ? 'ok' : 'bad'}">
      <h3>${right ? check + '漂亮，你看穿了！' : cross + '中計了！'}</h3>
      <p>${q.why}</p>
      <p class="save">${right ? `這題幫荷包省下 $${q.save}` : `如果選 ${q.ans.toUpperCase()} 可以多省 $${q.save}`}</p>
      ${originHTML(q)}
    </div>
    <button class="btn block" id="next" type="button" style="margin-top: 14px">${last ? '看我的比一比結果 →' : '下一關 →'}</button>`;
  const next = document.getElementById('next');
  document.querySelector('.verdict').focus({ preventScroll: true });
  document.getElementById('after').scrollIntoView({ block: 'start', behavior: 'instant' });
  next.addEventListener('click', () => { state.i += 1; last ? renderResult() : renderQuestion(); });
}

function renderResult() {
  clearInterval(state.clock);
  window.scrollTo(0, 0);
  const total = elapsed();
  const secs = Math.max(1, Math.round(total));
  const correct = state.picks.filter((p, i) => p === QUESTIONS[i].ans).length;
  const saved = QUESTIONS.reduce((s, q, i) => s + (state.picks[i] === q.ans ? q.save : 0), 0);
  const missed = MAX_SAVE - saved;
  const fast = total <= FAST_SECONDS;
  const tier = correct >= 5 ? 'Sharp' : correct >= 3 ? 'Mid' : 'Loose';
  const key = (fast ? 'fast' : 'slow') + tier;
  const r = ROLES[key];
  track('challenge_complete', { correct: correct, saved: saved, seconds: secs, role: r.role, from_challenge: !!VS });
  const rows = QUESTIONS.map((q, i) => {
    const ok = state.picks[i] === q.ans;
    return `<div class="rv"><span class="mark ${ok ? 'ok' : 'bad'}" aria-label="${ok ? '答對' : '答錯'}">${ok ? check : cross}</span>

      </div>
    </section>
    <button class="btn ghost block" id="again" type="button">再玩一次</button>
    <p class="foot">題目價格為情境示意，省下金額以遊戲情境計算。發票同步最多需要 48 小時，價格紀錄會隨你的發票逐步累積。</p>`;
  document.getElementById('dl-android').addEventListener('click', () => track('install_click', { store: 'android', role: r.role }));
  document.getElementById('dl-ios').addEventListener('click', () => track('install_click', { store: 'ios', role: r.role }));
  document.getElementById('again').addEventListener('click', () => { track('play_again'); renderIntro(); });

  const msg = t => { document.getElementById('copied').textContent = t; };
  let cardBlob = null;
  drawShareCard(r, correct, secs).then(blob => {
    cardBlob = blob;
    const img = document.getElementById('share-preview');
    if (img && blob) { img.src = URL.createObjectURL(blob); img.hidden = false; }
  }).catch(() => {});
  document.getElementById('share-card').addEventListener('click', async () => {
    if (!cardBlob) cardBlob = await drawShareCard(r, correct, secs).catch(() => null);
    if (!cardBlob) { msg('圖卡產生失敗，改傳挑戰連結吧'); return; }
    const file = new File([cardBlob], 'super-compare.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], text: shareText + ' ' + link });
        track('share', { method: 'card', role: r.role });
      } catch (e) {}
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(cardBlob); a.download = 'super-compare.png';
      document.body.appendChild(a); a.click(); a.remove();
      track('share', { method: 'card_download', role: r.role });
      msg('圖卡已下載，貼到社群或傳給朋友吧');
    }
  });
  document.getElementById('share-link').addEventListener('click', async () => {
    if (navigator.share) {
      try {
        await navigator.share({ title: '超級比一比', text: shareText, url: link });
        track('share', { method: 'link', role: r.role });
        return;
      } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try {
      await navigator.clipboard.writeText(shareText + ' ' + link);
      track('share', { method: 'link_copy', role: r.role });
      msg('挑戰連結已複製，貼給朋友吧');
    } catch (e) { msg(link); }
  });
}

// 分享圖卡 1080×1350（IG／LINE 直式），不寫省下金額
function drawShareCard(r, correct, secs) {
  return new Promise((resolve, reject) => {
    const W = 1080, H = 1350, c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    const F = '-apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif';
    const rr = (x, y, w, h, rad) => { g.beginPath(); g.moveTo(x + rad, y); g.arcTo(x + w, y, x + w, y + h, rad); g.arcTo(x + w, y + h, x, y + h, rad); g.arcTo(x, y + h, x, y, rad); g.arcTo(x, y, x + w, y, rad); g.closePath(); };
    const draw = img => {
      g.fillStyle = '#3560FF'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#FFFFFF'; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
      g.font = `900 84px ${F}`; g.fillText('超級比一比', W / 2, 150);
      g.font = `500 36px ${F}`; g.globalAlpha = .88; g.fillText('全民比價王挑戰', W / 2, 205); g.globalAlpha = 1;
      rr(60, 250, W - 120, 930, 40); g.fill();
      if (img) {
        const iw = 340, ih = 425, ix = (W - iw) / 2, iy = 300;
        g.save(); rr(ix, iy, iw, ih, 28); g.clip(); g.drawImage(img, ix, iy, iw, ih); g.restore();
      }
      g.fillStyle = '#737380'; g.font = `500 34px ${F}`; g.fillText('我的賣場購物角色是', W / 2, 800);
      g.fillStyle = '#3560FF'; g.font = `900 80px ${F}`; g.fillText(r.role, W / 2, 895);
      g.fillStyle = '#EBEFFF'; rr(130, 935, 380, 120, 24); g.fill(); rr(570, 935, 380, 120, 24); g.fill();
      g.fillStyle = '#101119'; g.font = `800 52px ui-monospace, Menlo, monospace`;
      g.fillText(`${correct}/6`, 320, 1000); g.fillText(mmss(secs), 760, 1000);
      g.fillStyle = '#737380'; g.font = `500 28px ${F}`;
      g.fillText('看穿陷阱', 320, 1040); g.fillText('總時間', 760, 1040);
      g.fillStyle = '#101119'; g.font = `800 46px ${F}`; g.fillText('你敢跟我比一比嗎？', W / 2, 1130);
      g.fillStyle = '#FFFFFF'; g.font = `700 34px ${F}`; g.fillText('發票存摺 invos', W / 2, 1250);
      g.font = `400 26px ${F}`; g.globalAlpha = .85; g.fillText('invosdata-mkt.github.io/h5-games/price-challenge', W / 2, 1300); g.globalAlpha = 1;
      c.toBlob(b => b ? resolve(b) : reject(new Error('toBlob')), 'image/png');
    };
    const img = new Image();
    img.onload = () => draw(img);
    img.onerror = () => draw(null);
    img.src = r.img;
  });
}


renderIntro();
</script>
