addEventListener('pointerdown',e=>{if(siteHdr.classList.contains('on')&&state==='play'&&!siteHdr.contains(e.target)&&e.target!==hdrPull&&!hdrPull.contains(e.target))showHdr(false)},true);
addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&state!=='play')showHdr(true,'exit_fullscreen')});
function pickUp(s){s.got=true;s.g.visible=false;found++;$('found').textContent=found;
  track('invoice_found',{n:found,ms:Math.round(elapsed)});toast(`第 ${found} 張發票`,FACTS[s.i]);if(found===slips.length)finish()}
function finish(){state='done';lastMs=Math.round(elapsed);const k=rankOf(lastMs);
  $('rTime').textContent=fmt(lastMs);$('rTitle').textContent=RANKS[k][1];$('rDesc').textContent=RANKS[k][2];$('rLadder').innerHTML=ladderHTML(lastMs,'你在這');
  let res='none';const v=$('rVs');
  if(VS){const gap=lastMs-VS;res=Math.abs(gap)<100?'tie':gap<0?'win':'lose';v.className=res;
    v.innerHTML=res==='win'?`<b>你贏朋友 ${fmt(-gap)}！</b>你 ${fmt(lastMs)}，朋友 ${fmt(VS)}。`:res==='lose'?`<b>輸朋友 ${fmt(gap)}</b>你 ${fmt(lastMs)}，朋友 ${fmt(VS)}。`:`<b>平手</b>你們都是 ${fmt(VS)}。`;
    v.hidden=false;track('vs_result',{result:res})}else v.hidden=true;
  $('bShare').innerHTML=SHARE_IC+(res==='win'?'贏了！傳回去嗆朋友':res==='lose'?'不服，換我出題嗆別人':'嗆朋友來比');$('rHint').textContent='';
  setTimeout(()=>{$('res').classList.add('on');showHdr(true,'result')},900);track('museum_finish',{ms:lastMs,rank:RANKS[k][1],vs:res,mode:NIGHT?'night':'day'})}
function shareUrl(){return location.origin+location.pathname+'?'+new URLSearchParams({vs:lastMs,utm_source:'friend',utm_medium:'share',utm_campaign:'invoice_museum_vs'})}
const shareText=()=>NIGHT?`我半夜拿手電筒溜進發票博物館，只花 ${fmt(lastMs)}就找齊 8 張發票，你敢來比嗎？`:`我在發票博物館只花 ${fmt(lastMs)}就找齊 8 張發票，點連結跟我比，你能更快嗎？`;
$('bShare').onclick=async()=>{const url=shareUrl(),text=shareText();
  if(navigator.share){track('share',{method:'native',ms:lastMs});try{await navigator.share({title:'發票博物館',text,url});return}catch(e){if(e&&e.name==='AbortError'){track('share_cancel');return}}}
  track('share',{method:'copy',ms:lastMs});try{await navigator.clipboard.writeText(text+'\n'+url);$('rHint').textContent='挑戰連結已複製，貼給朋友就好。'}catch(e){$('rHint').textContent='複製這個連結傳給朋友：'+url}};
$('bAgain').onclick=()=>{track('replay');startHunt()};
$('bLook').onclick=()=>{$('res').classList.remove('on');state='look';showHdr(false);track('stay_look')};
$('aStore').onclick=()=>track('store_click',{where:'result'});

// ---------- 碰撞 ----------
const R=0.3;
function collide(p){for(const n of npcs){if(n.off)continue;const dx=p.x-n.x,dz=p.z-n.z,d=Math.hypot(dx,dz),m=R+0.32;if(d<m&&d>1e-6){p.x=n.x+dx/d*m;p.z=n.z+dz/d*m}}
  for(const b of solids){const cx=Math.max(b.x0,Math.min(p.x,b.x1)),cz=Math.max(b.z0,Math.min(p.z,b.z1));const dx=p.x-cx,dz=p.z-cz,d=Math.hypot(dx,dz);
  if(d<R){if(d>1e-6){p.x=cx+dx/d*R;p.z=cz+dz/d*R}else{const o=[p.x-b.x0,b.x1-p.x,p.z-b.z0,b.z1-p.z],m=Math.min(...o),k=o.indexOf(m);if(k===0)p.x=b.x0-R;if(k===1)p.x=b.x1+R;if(k===2)p.z=b.z0-R;if(k===3)p.z=b.z1+R}}}}

// 牆上（Ⅲ／Ⅳ 與 Ⅴ 之間）的標題與掛畫：人在 Ⅴ 時跟著牆一起變透明
const fadeDeco=[];scene.traverse(o=>{if(o.isMesh&&o.position.y>0.5&&o.position.z>-D/2+0.1&&o.position.z<-D/2+0.25&&!o.parent.isGroup){[].concat(o.material).forEach(m=>m.transparent=true);fadeDeco.push(o)}});
// ---------- 迴圈 ----------
const clock=new THREE.Clock();let walkT=0;
function loop(){
  const dt=Math.min(clock.getDelta(),0.05);
  if(mode==='guided'&&state==='play'){
    if(tour.moving){const goal=TS[tour.k].s;tour.s=Math.min(goal,tour.s+2.8*dt);const p=tourAt(tour.s);player.position.x=p.x;player.position.z=p.z;
      let df=Math.atan2(p.dx,p.dz)-heading;df=Math.atan2(Math.sin(df),Math.cos(df));heading+=df*Math.min(1,dt*10);player.rotation.y=heading;
      walkT+=dt*10;legL.position.z=Math.sin(walkT)*0.08;legR.position.z=-Math.sin(walkT)*0.08;player.position.y=Math.abs(Math.sin(walkT))*0.04;
      if(tour.s>=goal-1e-3){tour.moving=false;const ex=exhibits[TS[tour.k].i];heading=Math.atan2(ex.g.position.x-p.x,ex.g.position.z-p.z);player.rotation.y=heading;legL.position.z=legR.position.z=0;player.position.y=0;openCard(ex.i)}}
    const ahead=Math.min(tour.s+1.3,TLEN),gp=tourAt(ahead),g=guide.g;
    if(TLEN-tour.s<1.2){g.position.set(player.position.x+1.1,0,player.position.z+0.2)}else g.position.set(gp.x,0,gp.z);
    const gw=tour.moving?Math.atan2(gp.dx,gp.dz):Math.atan2(player.position.x-g.position.x,player.position.z-g.position.z);let gd2=gw-g.rotation.y;gd2=Math.atan2(Math.sin(gd2),Math.cos(gd2));g.rotation.y+=gd2*Math.min(1,dt*8);
    const gwalk=tour.moving?Math.sin(walkT):0;guide.l1.position.z=gwalk*0.07;guide.l2.position.z=-gwalk*0.07;
  }else{
  // 方向：搖桿／鍵盤是「畫面方向」（上＝往裡走）
  let mx=jx+((keys['d']||keys['arrowright'])?1:0)-((keys['a']||keys['arrowleft'])?1:0);
  let mz=jy+((keys['s']||keys['arrowdown'])?1:0)-((keys['w']||keys['arrowup'])?1:0);
  if(Math.hypot(mx,mz)>0.05){target=null;pendingOpen=null}
  else if(target){const dx=target.x-player.position.x,dz=target.z-player.position.z,d=Math.hypot(dx,dz);
    if(d<0.15){target=null;if(pendingOpen!==null)openCard(pendingOpen)}else{mx=dx/d;mz=dz/d}}
  const mag=Math.hypot(mx,mz);
  if(mag>0.05){if(mag>1){mx/=mag;mz/=mag}hideTip();
    const before=player.position.clone(),sp=3.2*dt;player.position.x+=mx*sp;player.position.z+=mz*sp;collide(player.position);
    // 被擋住走不動就放棄點地板的目標
    if(target&&player.position.distanceTo(before)<sp*0.2){stuckT+=dt;if(stuckT>0.4){target=null;pendingOpen=null;stuckT=0}}else stuckT=0;
    const want=Math.atan2(mx,mz);let df=want-heading;df=Math.atan2(Math.sin(df),Math.cos(df));heading+=df*Math.min(1,dt*10);player.rotation.y=heading;
    walkT+=dt*10;legL.position.z=Math.sin(walkT)*0.08;legR.position.z=-Math.sin(walkT)*0.08;player.position.y=Math.abs(Math.sin(walkT))*0.04}
  else{legL.position.z=legR.position.z=0;player.position.y=0}
  }
  // 靠近展品：光圈變亮＋底部按鈕
  let best=null,bd=1.6;exhibits.forEach(ex=>{const d=Math.hypot(ex.x-player.position.x,ex.z-player.position.z);ex.ring.material.opacity=d<1.6?0.75:0.25;if(d<bd){bd=d;best=ex.i}});
  {let want=null;
    if(mode==='guided'&&state==='play'){if(!tour.moving&&!cardOn&&tour.k>=0)want=tour.k>=TS.length-1?'前往出口 ▶':'帶我到下一站 ▶'}
    else if(state==='play'&&!quizDone&&Math.hypot(EXITP.x-player.position.x,EXITP.z-player.position.z)<2.0)want='寫問卷拿金幣';
    else if(best!==null)want='看展品：'+EXHIBITS[best].t;
    near=best;if(want!==nearBtn.dataset.w){nearBtn.dataset.w=want||'';if(!want)nearBtn.classList.remove('on');else{nearBtn.textContent=want;nearBtn.classList.add('on')}}}
  if(staff.sign)staff.sign.quaternion.copy(cam.quaternion);
  // 擋住小人的牆變半透明
  fadeDeco.forEach(m=>{const inFront=-D/2>player.position.z&&-D/2-player.position.z<5;m.material.opacity+=((inFront?0.15:1)-m.material.opacity)*Math.min(1,dt*8)});
  fadeWalls.forEach(w=>{const z=w.userData.z,inFront=z>player.position.z&&z-player.position.z<5;const o=inFront?0.18:1;w.material.opacity+=(o-w.material.opacity)*Math.min(1,dt*8);w.castShadow=w.material.opacity>0.9});
  if(state==='play'&&!cardOn){elapsed=performance.now()-t0;$('clock').textContent=fmtClock(elapsed);
    slips.forEach(s=>{if(!s.got&&Math.hypot(s.x-player.position.x,s.z-player.position.z)<0.85)pickUp(s)})}
  if(NIGHT&&!cardOn&&state!=='intro'){gd.cool-=dt;if(gd.cool<=0&&seenByGuard()){gd.cool=5;
    toast('被警衛照到了！','快躲到牆後面，別被發現。');track('guard_caught',{state})}}
  const tt=performance.now()/1000;slips.forEach(s=>{s.paper.position.y=0.75+Math.sin(tt*2.4+s.i)*0.08;s.paper.rotation.y=tt*1.2+s.i;s.glow.material.opacity=0.35+0.25*Math.sin(tt*3+s.i)});
  updateNPC(dt,tt);coin.rotation.y+=dt*0.5;if(drum)drum.rotation.x+=dt*0.9;if(cloud)cloud.position.y=2.45+Math.sin(tt*1.3)*0.08;if(bubble){bubble.position.y=2.25+Math.sin(tt*2)*0.06;bubble.quaternion.copy(cam.quaternion)}
  spinners.forEach(f=>f(dt,tt));
  digTiles.forEach(o=>{o.acc+=dt;if(o.acc>o.sp){o.acc=0;o.d=(o.d+1)%10;o.t.material.map=DIG[o.d]}});sun.position.set(player.position.x+6,18,player.position.z+10);sun.target.position.set(player.position.x,0,player.position.z);
  inv.rotation.y+=dt*0.6;placeCam(false);placeJoy();
  renderer.render(scene,cam);requestAnimationFrame(loop)}
document.getElementById('seenN').textContent=EXHIBITS.length;
loop();
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.fov=fovFor();cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);placeCam(true)});
</script>
